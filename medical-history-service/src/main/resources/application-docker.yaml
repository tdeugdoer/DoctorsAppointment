spring:
  config:
    import: optional:classpath:.docker-env[.properties]
  cloud:
    openfeign:
      client:
        config:
          appointment:
            url: http://appointment-service:8082/api/v1/appointments
            connect-timeout: 3000
            read-timeout: 5000

minio:
  bucket: ${MINIO_BUCKET}
  host: ${MINIO_HOST}
  port: ${MINIO_PORT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}

server:
  port: ${SPRING_PORT}