spring:
  config:
    import: optional:classpath:.docker-env[.properties]
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE}

minio:
  bucket: ${MINIO_BUCKET}
  host: ${MINIO_HOST}
  port: ${MINIO_PORT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}

server:
  port: ${SPRING_PORT}