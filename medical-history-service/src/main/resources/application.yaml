spring:
  config:
    import: optional:classpath:.env[.properties]
  application:
    name: medical-history-service
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mongock:
  migration-scan-package:
    - com.tserashkevich.medicalhistoryservice.migrations

minio:
  bucket: ${MINIO_BUCKET}
  host: ${MINIO_HOST}
  port: ${MINIO_PORT}
  accessKey: ${MINIO_ACCESS_KEY}
  secretKey: ${MINIO_SECRET_KEY}

server:
  port: ${SPRING_PORT}