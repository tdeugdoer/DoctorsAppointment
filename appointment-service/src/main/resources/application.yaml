spring:
  config:
    import: optional:classpath:.env[.properties]
  application:
    name: appointment-service
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DATABASE}
  cloud:
    openfeign:
      client:
        config:
          patient:
            url: http://localhost:8080/api/v1/patients
            connect-timeout: 3000
            read-timeout: 5000
          doctor:
            url: http://localhost:8081/api/v1/doctors
            connect-timeout: 3000
            read-timeout: 5000
          service:
            url: http://localhost:8083/api/v1/services
            connect-timeout: 3000
            read-timeout: 5000

resilience4j:
  retry:
    instances:
      retry-conf:
        max-attempts: 3
        wait-duration: 1s
        ignore-exceptions:
          - com.tserashkevich.appointmentservice.exceptions.feign.OtherServiceNotFoundException
  circuitbreaker:
    instances:
      circuitbreaker-conf:
        sliding-window-type: count_based
        sliding-window-size: 5
        failure-rate-threshold: 75
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 20s
        max-wait-duration-in-half-open-state: 5s
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - com.tserashkevich.appointmentservice.exceptions.feign.OtherServiceNotFoundException

eureka:
  client:
    service-url:
      defaultZone: http://eureka@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

mongock:
  migration-scan-package:
    - com.tserashkevich.appointmentservice.migrations

server:
  port: ${SPRING_PORT}